<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f6;
  --card: #ffffff;
  --ink: #14213d;
  --muted: #5b667a;
  --line: #cfd7e3;
  --accent: #2f5bff;
  --accent-ink: #ffffff;
  --danger: #c62d3f;
  --panel: #14213d;
  --panel-ink: #f3f6fb;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1220; --card: #151c30; --ink: #eaf0fb; --muted: #97a3ba;
    --line: #2b3550; --accent: #6f8dff; --accent-ink: #0d1220;
    --danger: #ff7a89; --panel: #1b2542; --panel-ink: #eaf0fb;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1220; --card: #151c30; --ink: #eaf0fb; --muted: #97a3ba;
  --line: #2b3550; --accent: #6f8dff; --accent-ink: #0d1220;
  --danger: #ff7a89; --panel: #1b2542; --panel-ink: #eaf0fb;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}
.side {
  background: var(--panel);
  color: var(--panel-ink);
  padding: 56px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.brand { font-family: "Bricolage Grotesque", Georgia, serif; font-weight: 600; font-size: 1.25rem; }
.side h2 {
  font-family: "Bricolage Grotesque", Georgia, serif;
  font-weight: 800;
  font-size: clamp(2.2rem, 4.2vw, 3.6rem);
  line-height: 1.02;
  letter-spacing: -0.03em;
  margin: 0 0 16px;
  max-width: 12ch;
}
.side p { margin: 0; max-width: 34ch; line-height: 1.55; opacity: .8; }
main { display: grid; place-items: center; padding: 32px 20px; }
.card { width: 100%; max-width: 400px; }
.card h1 {
  font-family: "Bricolage Grotesque", Georgia, serif;
  font-weight: 800;
  font-size: 2rem;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
}
.sub { margin: 0 0 28px; color: var(--muted); }
.field { margin-bottom: 18px; }
label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 6px; }
.control { position: relative; }
input[type="email"], input[type="password"], input[type="text"] {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
}
input:focus-visible, button:focus-visible, a:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
input[aria-invalid="true"] { border-color: var(--danger); }
.error { color: var(--danger); font-size: .85rem; margin: 6px 0 0; min-height: 1.1em; }
.toggle {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  background: none; border: 0; color: var(--muted);
  font: inherit; font-size: .85rem; font-weight: 600;
  padding: 8px 10px; cursor: pointer; border-radius: 8px;
}
.row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 24px; font-size: .92rem; }
.row label { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 0; }
.row input { width: 18px; height: 18px; accent-color: var(--accent); }
a { color: var(--accent); font-weight: 600; text-decoration: none; }
a:hover { text-decoration: underline; }
.submit {
  width: 100%;
  font: inherit; font-weight: 600;
  background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 10px;
  padding: 14px; cursor: pointer;
}
.submit:hover { filter: brightness(1.08); }
.submit[disabled] { opacity: .7; cursor: progress; }
.status { margin-top: 16px; min-height: 1.3em; font-size: .92rem; color: var(--muted); }
.foot { margin-top: 28px; color: var(--muted); font-size: .92rem; }
@media (max-width: 800px) {
  body { grid-template-columns: 1fr; }
  .side { padding: 28px 24px; gap: 20px; }
  .side h2 { font-size: 2rem; max-width: none; }
  .side p { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<aside class="side">
  <div class="brand">CodyMentor</div>
  <div>
    <h2>Pick up where you left off.</h2>
    <p>Sign in to see your projects, recent activity, and saved settings.</p>
  </div>
</aside>

<main>
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Enter your email and password to continue.</p>

    <form id="login" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-err">
        <p class="error" id="email-err"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="control">
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" aria-describedby="pw-err" style="padding-right:72px">
          <button type="button" class="toggle" id="toggle" aria-controls="password" aria-pressed="false">Show</button>
        </div>
        <p class="error" id="pw-err"></p>
      </div>

      <div class="row">
        <label><input type="checkbox" name="remember"> Keep me signed in</label>
        <a href="#forgot">Forgot password?</a>
      </div>

      <button class="submit" type="submit" id="submit">Sign in</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="foot">New here? <a href="#signup">Create an account</a></p>
  </div>
</main>

<script>
(function () {
  var form = document.getElementById('login');
  var email = document.getElementById('email');
  var pw = document.getElementById('password');
  var emailErr = document.getElementById('email-err');
  var pwErr = document.getElementById('pw-err');
  var status = document.getElementById('status');
  var btn = document.getElementById('submit');
  var toggle = document.getElementById('toggle');

  toggle.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Hide' : 'Show';
    toggle.setAttribute('aria-pressed', String(show));
  });

  function check() {
    var ok = true;
    emailErr.textContent = ''; pwErr.textContent = '';
    email.removeAttribute('aria-invalid'); pw.removeAttribute('aria-invalid');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
      emailErr.textContent = 'Enter a valid email address, like name@example.com.';
      email.setAttribute('aria-invalid', 'true');
      ok = false;
    }
    if (pw.value.length < 8) {
      pwErr.textContent = 'Password must be at least 8 characters.';
      pw.setAttribute('aria-invalid', 'true');
      ok = false;
    }
    return ok;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    status.textContent = '';
    if (!check()) {
      (form.querySelector('[aria-invalid="true"]') || email).focus();
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    // Demo only: replace this timeout with a real request to your server.
    setTimeout(function () {
      btn.disabled = false;
      btn.textContent = 'Sign in';
      status.textContent = 'Signed in (demo). Connect this form to your backend.';
    }, 900);
  });
})();
</script>
</body>
</html>
